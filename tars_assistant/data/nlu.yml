    - apri la cartella [Windows\System32](cartella) nel disco [C](disco)
    - cosa c'è in [D](disco) nella cartella [Documenti\Report](cartella)
    - mostrami il contenuto della cartella [Programmi\MyApp](cartella) nel disco [C](disco)

- intent: elimina_file
  examples: |
    - elimina il file [C:\\Users\\User\\file.txt](file)
    - cancella [D:\\Documenti\\report.docx](file)
    - rimuovi il file [R:\\backup\\vecchio.zip](file)
    - puoi eliminare [D:\\temp\\scarto.log](file)?
    # RIMOSSO: un esempio costituito dal solo percorso, senza verbo.
    # Insegnava al modello che qualunque stringa somigliante a un percorso
    # significa "cancella" -- su un'azione distruttiva e' il peggio possibile.

- intent: sposta_file
  examples: |
    - sposta il file [C:\\Users\\User\\file.txt](file) in [D:\\Backup](destinazione)
    - muovi [D:\\Download\\immagine.png](file) in [E:\\Immagini](destinazione)
    - copia [F:\\temp\\file.doc](file) in [G:\\Archivio](destinazione)

# RIMOSSO: l'intent "nlu_fallback" definito a mano.
# E' un intent RISERVATO, generato a runtime dal FallbackClassifier quando la
# confidenza scende sotto soglia. Definirlo con esempi -- che peraltro erano
# frasi del bot, non dell'utente -- insegnava al modello a classificare le
# proprie risposte, e impediva al fallback reale di funzionare.

