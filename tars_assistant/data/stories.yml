version: "3.1"

stories:

- story: happy path
  steps:
    - intent: greet
    - action: utter_greet
    - intent: mood_great
    - action: utter_happy

- story: sad path 1
  steps:
    - intent: greet
    - action: utter_greet
    - intent: mood_unhappy
    - action: utter_cheer_up
    - action: utter_did_that_help
    - intent: affirm
    - action: utter_happy

- story: sad path 2
  steps:
    - intent: greet
    - action: utter_greet
    - intent: mood_unhappy
    - action: utter_cheer_up
    - action: utter_did_that_help
    - intent: deny
    - action: utter_goodbye

# Le due storie sopra cominciano entrambe con un saluto. Ma nessuno saluta un
# assistente vocale prima di dirgli qualcosa: nell'uso reale la conversazione
# comincia direttamente dal contenuto. Senza queste due varianti,
# MemoizationPolicy non aggancia il percorso e la conferma finisce nel
# fallback -- verificato sul campo.

- story: umore negativo senza saluto, conferma
  steps:
    - intent: mood_unhappy
    - action: utter_cheer_up
    - action: utter_did_that_help
    - intent: affirm
    - action: utter_happy

- story: umore negativo senza saluto, negazione
  steps:
    - intent: mood_unhappy
    - action: utter_cheer_up
    - action: utter_did_that_help
    - intent: deny
    - action: utter_goodbye

- story: mostra contenuto cartella
  steps:
    - intent: mostra_contenuto
    - action: action_mostra_contenuto

- story: elimina un file
  steps:
    - intent: elimina_file
    - action: action_elimina_file

- story: sposta un file
  steps:
    - intent: sposta_file
    - action: action_sposta_file
