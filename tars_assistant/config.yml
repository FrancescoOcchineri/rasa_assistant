version: "3.1"

recipe: default.v1

language: it

pipeline:
- name: WhitespaceTokenizer
- name: RegexFeaturizer
- name: LexicalSyntacticFeaturizer
- name: RegexEntityExtractor
  # use_lookup_tables passa a true: le lookup table sono il meccanismo
  # corretto per le entita' a vocabolario chiuso (i nomi dei tuoi dispositivi,
  # per esempio). Con nessuna tabella definita la componente resta inerte, ma
  # cosi' e' pronta.
  use_lookup_tables: true
  use_regexes: true
  use_word_boundaries: true
- name: CountVectorsFeaturizer
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 1
  max_ngram: 4
- name: DIETClassifier
  epochs: 100
  max_sequence_length: 128
  constrain_similarities: true
- name: EntitySynonymMapper
- name: ResponseSelector
  epochs: 100
  # Toglie l'avviso "constrain_similarities is set to False" che comparve nel
  # log di avvio sul Raspberry. Con la cross-entropy e' la scelta consigliata.
  constrain_similarities: true
- name: FallbackClassifier
  # Soglia alzata da 0.3 a 0.65.
  # Con azioni distruttive fra gli intent -- elimina_file cancella davvero --
  # una soglia bassa significa che una frase ambigua viene eseguita invece di
  # finire nel fallback. Meglio un "non ho capito" di troppo che un file in
  # meno.
  threshold: 0.65
  ambiguity_threshold: 0.15
  # RIMOSSO: epochs. Non e' un parametro del FallbackClassifier -- non
  # addestra nulla, applica soglie a valle del classificatore.

policies:
- name: MemoizationPolicy
  max_history: 5

# REINSERITA dopo averla rimossa per errore.
#
# L'avevo togliata ragionando che con sei storie non potesse imparare nulla di
# utile -- vero sulla qualita' dell'apprendimento, sbagliato sulla conseguenza.
# Il suo ruolo qui non e' generalizzare in modo intelligente: e' fornire UNA
# previsione qualsiasi per gli stati non visti. Senza di lei, MemoizationPolicy
# aggancia solo i percorsi identici alle storie e tutto il resto precipita nel
# fallback -- verificato: un "si" dopo una domanda, senza il saluto iniziale
# previsto dalla storia, finiva in fallback.
#
# 50 epoch invece di 100: con questo numero di storie il resto e' tempo speso
# a memorizzare rumore.
- name: TEDPolicy
  max_history: 5
  epochs: 50
  constrain_similarities: true

- name: RulePolicy
  core_fallback_threshold: 0.3
  # DEVE essere un'azione, non una utterance.
  # Con "utter_fallback" qui, Rasa pronunciava la frase, si ritrovava nello
  # stesso stato indeciso, richiamava il fallback, e ripeteva fino al limite di
  # dieci azioni per turno: dieci messaggi di fallback consecutivi.
  # action_default_fallback pronuncia utter_default E riavvolge il messaggio
  # utente dal tracker, chiudendo il turno.
  core_fallback_action_name: "action_default_fallback"
  enable_fallback_prediction: true

assistant_id: 20250603-194416-exhaustive-chick
